name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  BIN_NAME: jb

jobs:
  dist:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # don't fail other jobs if one fails
      matrix:
        include:
          - build: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - build: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - build: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - build: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - build: android-arm64_v8a
            os: ubuntu-latest
            target: aarch64-linux-android
            abi: arm64-v8a
          - build: android-armeabi_v7a
            os: ubuntu-latest
            target: armv7-linux-androideabi
            abi: armeabi-v7a
          - build: android-x86_64
            os: ubuntu-latest
            target: x86_64-linux-android
            abi: x86_64
          - build: android-x86
            os: ubuntu-latest
            target: i686-linux-android
            abi: x86

    steps:
      - uses: actions/checkout@v6

      - name: Setup Android NDK
        if: matrix.abi
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true
          local-cache: true

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 linker
        if: matrix.build == 'linux-aarch64'
        run: |
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install cargo-ndk
        if: matrix.abi
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build release binary
        if: ${{ !matrix.abi }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build release binary
        if: matrix.abi
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t ${{ matrix.abi }} build --release --locked

      - name: Build archive
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${BIN_NAME}-${TAG}-${{ matrix.build }}"
          mkdir -p $name
          cp LICENSE $name
          cp README.md $name

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/$BIN_NAME.exe" $name
          else
            cp "target/${{ matrix.target }}/release/$BIN_NAME" $name
          fi
          tar -czf "$name.tar.gz" $name
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ github.ref_name }}-${{ matrix.build }}
          path: ${{ env.ASSET }}
          archive: false
          if-no-files-found: error

  release:
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
            cd artifacts
            sha256sum * | awk '{print $2, $1}' > ../check_SHA256SUMS.txt
            mv ../check_SHA256SUMS.txt ./

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
