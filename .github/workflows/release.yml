name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  BIN_NAME: jb

jobs:
  dist:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # don't fail other jobs if one fails
      matrix:
        include:
          - build: linux-x86_64
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-gnu
            cross: false
          - build: linux-aarch64
            os: ubuntu-latest
            rust: stable
            target: aarch64-unknown-linux-gnu
            cross: true
          - build: macos-x86_64
            os: macos-latest
            rust: stable
            target: x86_64-apple-darwin
          - build: windows-x86_64
            os: windows-latest
            rust: stable
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      - name: Install aarch64 linker
        if: matrix.build == 'linux-aarch64'
        run: |
            sudo apt-get update
            sudo apt-get install gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip release binary (linux and macos)
        if: matrix.build == 'linux-x86_64' || matrix.build == 'macos-x86_64'
        run: strip "target/${{ matrix.target }}/release/$BIN_NAME"

      - name: Strip release binary (arm)
        if: matrix.build == 'linux-aarch64'
        run: aarch64-linux-gnu-strip "target/${{ matrix.target }}/release/$BIN_NAME"

      - name: Build archive
        shell: bash
        run: |
          mkdir -p dist
          cp LICENSE dist/
          cat << 'EOF' > dist/README.md
          # jb cli

          Source: https://github.com/HBcao233/jb-rs/

          Usage: jb [Options] <url>
          Options:
          * -i, --info  information only.
          * -h, --help  show this help message.

          # Supported Platforms
          * Bilibili
          EOF

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/$BIN_NAME.exe" dist/
          else
            cp "target/${{ matrix.target }}/release/$BIN_NAME" dist/
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}_${{ github.ref_name }}_${{ matrix.build }}
          path: dist
