[workspace]
members = [
    "jb",
    "jb-core",
]
resolver = "2"

[workspace.dependencies]
tracing = { version = "0.1.44", default-features = false }
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
wreq = { version = "0.16.1", features = ["query", "form", "json", "stream", "multipart"] }
wreq-util = "0.2.0"
thiserror = "2.0.21"
