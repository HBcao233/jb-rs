[package]
name = "jb-core"
version = "0.3.0"
edition = "2024"

[features]
jmcomic = [
    "dep:aes",
    "dep:ecb",
    "dep:base64",
    "dep:futures-util",
]

[dependencies]
jiff.workspace = true
tokio = { version = "1.52.3", default-features = false, features = [] }
tracing.workspace = true
wreq.workspace = true

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
md5 = { version = "0.8.1" }
thiserror.workspace = true
rand = "0.10.3"
form_urlencoded = "1.2.2"

aes = { version = "0.9.1", optional = true }
ecb = { version = "0.2.1", optional = true }
base64 = { version = "0.23.1", optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
wreq-util.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"]}
