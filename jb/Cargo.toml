[package]
name = "jb"
version = "0.1.0"
authors = ["HBcao <hbcaoqaq@outlook.com>"]
license = "MIT OR Apache-2.0"
description = ""
homepage = "https://github.com/HBcao233/jbot"
repository = "https://github.com/HBcao233/jbot"
keywords = ["cli"]
categories = []
edition = "2024"

[features]

[dependencies]
jb-core = { path = "../jb-core" }

tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "std", "env-filter"]}
jiff.workspace = true
unicode-width = "0.2.2"
# 获取终端尺寸
rustix = { version = "1.1.5", default-features = false, features = ["std", "termios"] }
# 进度条
indicatif = "0.18.6"
thiserror.workspace = true

regex = { version = "1.13" }
wreq.workspace = true
wreq-util.workspace = true
futures-util = { version = "0.3" }
